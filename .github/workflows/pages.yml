# Builds and deploys the site to GitHub Pages:
#
#   /            demos/site/index.html         (landing page)
#   /reference/  tools/reference-reader            (Vite build of the reference, data from tools/reference/build.py)
#   /typescript/ demos/typescript/geometry-samples  (Vite build)
#   /sdf/        demos/typescript/sdf               (Vite build)
#   /rust/       demos/rust/geometry-samples/web + src  (static; wasm is checked in)
#
# Enable in repo settings: Settings -> Pages -> Source: "GitHub Actions".

name: Deploy the site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The reference's grammar evidence reads the Parakeet sources.
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            demos/typescript/geometry-samples/package-lock.json
            demos/typescript/sdf/package-lock.json
            tools/reference-reader/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the reference reader
        working-directory: tools/reference-reader
        run: |
          npm ci
          npm test
          npm run build -- --base=/${{ github.event.repository.name }}/reference/

      - name: Build TypeScript geometry samples
        working-directory: demos/typescript/geometry-samples
        run: |
          npm ci
          npm test
          npm run build -- --base=/${{ github.event.repository.name }}/typescript/

      - name: Build TypeScript SDF demo
        working-directory: demos/typescript/sdf
        run: |
          npm ci
          npm run typecheck
          npm run build -- --base=/${{ github.event.repository.name }}/sdf/

      - name: Assemble site
        run: |
          mkdir -p _site/rust/src
          cp demos/site/index.html _site/
          cp -r tools/reference-reader/dist/. _site/reference/
          cp -r demos/typescript/geometry-samples/dist/. _site/typescript/
          cp -r demos/typescript/sdf/dist/. _site/sdf/
          cp demos/rust/geometry-samples/web/index.html \
             demos/rust/geometry-samples/web/main.js \
             demos/rust/geometry-samples/web/geometry_samples.wasm \
             _site/rust/
          cp demos/rust/geometry-samples/src/plato.rs _site/rust/src/
          cp -r demos/rust/geometry-samples/src/samples _site/rust/src/samples

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
